appId: com.xuan.md
productName: xuan-md
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 直接声明可处理的文档类型：既按扩展名，也按系统 markdown UTI
  # （macOS 实际是按 UTI net.daringfireball.markdown 路由 .md 文件的）
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown Document
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        LSItemContentTypes:
          - net.daringfireball.markdown
          - public.markdown
        CFBundleTypeExtensions:
          - md
          - markdown
          - mdown
          - mkd
          - mkdn
          - mdtext
          - text
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  fileAssociations:
    - ext:
        - md
        - markdown
        - mdown
        - mkd
        - mkdn
        - mdtext
      name: Markdown Document
      description: Markdown document
nsis:
  # Windows 文件关联由 NSIS 的机器级安装注册，因此需要管理员权限。
  perMachine: true
  allowElevation: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: xuan-md
